<div class = "leaderboard backdrop-blur-md bg-black/40 rounded-t-md">
    <div class = "all-players-results">

        @for (player of scores(); track player.uuid) {
            <div class="player-results">
                <p >{{player.name}} : </p>
                <p style="font-family: 'Pirata One'">{{player.score}}</p>
            </div>
        }
    </div>
    
</div>
