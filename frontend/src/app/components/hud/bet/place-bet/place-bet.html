<div class="backdrop-blur-md bg-black/40 rounded-t-xl w-full">

    <p 
      class="text-white text-[70px] leading-none font-[Pirata One] text-center p-2" 
      style="font-family: 'Pirata One';"
    >
      {{ bet() }}
    </p>

    <!-- Boutons -->
    <div class="flex justify-center gap-4 p-2">
      @if (buttonDisabled()) {
        <button mat-fab (click)="decrease()" disabled>
          <mat-icon class="text-white">remove</mat-icon>
          ok
        </button>
      } @else {
        <button mat-fab (click)="decrease()">
          <mat-icon class="text-white">remove</mat-icon>
        </button>
      }
      

      <button mat-fab (click)="increase()" [disabled]="buttonDisabled()">
        <mat-icon class="text-white">add</mat-icon>
      </button>
    </div>

    <div class="flex justify-center gap-4 p-4">

      <button 
        mat-flat-button 
        color="primary"
        (click)="placeBet()"
        [disabled]="buttonDisabled()"
        class="uppercase font-bold tracking-wide"
      >
        Miser
      </button>

    </div>
    

</div>
