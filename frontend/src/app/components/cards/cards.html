<div class="card">
  <img [src]="card.image" alt="{{ card.name }}">

  @if (isCardSpecial(card)) {
    <button 
      class="info-button" 
      [title]="
        (card.description ? 'Description : ' + card.description : '') +
        (card.pouvoir ? ' \nPouvoir : ' + card.pouvoir : '')"
    >
      <img src="/images/icons/icone_info_2.svg"/>
    
    </button>
  }
  
</div>
