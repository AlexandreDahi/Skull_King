<div class="bg-black/40 backdrop-blur-md border border-white/10 rounded-2xl p-4 shadow-2xl flex items-center">

    <div class="text-2xl sm:text-3xl md:text-xl font-bold tracking-wide mr-4 ">
        Votre nom : 
    </div>
    <div class="text-2xl sm:text-3xl md:text-xl font-bold tracking-wide mr-4 ">
        @if (!editing()) {
            {{name()}}
        }
        @else {
            <input 
                type="text" 
                maxlength="30"
                minlength="3"
                [(ngModel)]="name"
                placeholder="Entrez votre nom" 
                class="w-full py-1 p-3 rounded-xl bg-white/10 border border-white/20 text-white placeholder-gray-400
                focus:outline-none focus:ring-1 focus:ring-gray-300"
            >
        
        }
        
    </div> 

    <button 
        mat-fab 
        class="bg-yellow-500 hover:bg-yellow-600 text-black font-semibold 
               px-2 py-2 sm:px-4 rounded-xl shadow-lg transition 
               flex items-center gap-1 cursor-pointer"
        (click)="checkName()"
    >
        @if(editing()) {
            <mat-icon class="text-white">check</mat-icon>
        }
        @else {
            <mat-icon class="text-white">edit</mat-icon>
        }
        
        
        
    </button>

</div>
